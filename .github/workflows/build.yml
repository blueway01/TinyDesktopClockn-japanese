name: ビルドとテスト
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: ビルド
        shell: pwsh
        run: ./build.ps1
      - name: 単体テスト
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/TinyDesktopClockn.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "単体テスト失敗: $($process.ExitCode)" }
      - name: 統合テスト
        shell: pwsh
        run: |
          # 新規のCIユーザーでは自動起動用キーが未作成のため、空のキーだけ準備する。
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Force | Out-Null
          ./test-integration.ps1
      - name: 実行ファイル
        uses: actions/upload-artifact@v5
        with:
          name: TinyDesktopClockn-日本語版
          path: dist/TinyDesktopClockn.exe
